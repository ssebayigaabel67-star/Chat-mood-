<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<meta name="theme-color" content="#ff7a18">
<title>MOODCHAT — Chat By Mood</title>

<style>
*{
  box-sizing:border-box;
}

html,body{
  margin:0;
  min-height:100%;
  font-family:system-ui,Arial,sans-serif;
  color:#24170f;
}

body{
  min-height:100vh;
  display:grid;
  place-items:center;
  padding:18px;

  background:
    radial-gradient(
      circle at 12% 8%,
      rgba(255,120,180,.35),
      transparent 34%
    ),
    radial-gradient(
      circle at 90% 88%,
      rgba(255,180,80,.35),
      transparent 36%
    ),
    #fff7f0;
}

/* =========================
   AUTH CARD
========================= */

.auth-card{
  width:min(440px,100%);
  background:rgba(255,255,255,.96);
  border:1px solid #eadbd0;
  border-radius:26px;
  padding:24px;

  box-shadow:
    0 18px 55px rgba(80,45,20,.14);
}

/* =========================
   LOGO
========================= */

.logo{
  text-align:center;
  font-size:31px;
  font-weight:1000;
  letter-spacing:-1px;
}

.logo span{
  font-size:28px;
}

.auth-sub{
  text-align:center;
  color:#806f64;
  margin:5px 0 20px;
  font-size:14px;
}

/* =========================
   TABS
========================= */

.tabs{
  display:flex;
  gap:4px;

  background:#fff0e5;
  padding:4px;
  border-radius:14px;

  margin-bottom:17px;
}

.tabs button{
  flex:1;

  padding:11px;

  border:0;
  border-radius:11px;

  background:transparent;

  color:#806f64;

  font-weight:900;

  cursor:pointer;
}

.tabs button.active{
  background:#fff;
  color:#24170f;

  box-shadow:
    0 3px 12px rgba(0,0,0,.07);
}

/* =========================
   FORM
========================= */

.field{
  margin:12px 0;
}

.field label{
  display:block;

  font-size:12px;
  font-weight:900;

  margin-bottom:6px;
}

.field input,
.field select{
  width:100%;

  padding:13px 14px;

  border:1px solid #eadbd0;
  border-radius:13px;

  outline:0;

  background:#fff;
  color:#24170f;

  font-size:14px;
}

.field input:focus,
.field select:focus{
  border-color:#ff7a18;

  box-shadow:
    0 0 0 3px rgba(255,122,24,.12);
}

/* =========================
   BUTTON
========================= */

.primary{
  width:100%;

  padding:13px 16px;

  border:0;
  border-radius:13px;

  background:#ff7a18;
  color:#fff;

  font-weight:950;

  cursor:pointer;

  margin-top:7px;

  transition:.18s;
}

.primary:hover{
  transform:translateY(-1px);
}

.primary:active{
  transform:scale(.98);
}

.primary:disabled{
  opacity:.6;
  cursor:wait;
  transform:none;
}

/* =========================
   NOTE
========================= */

.small-note{
  text-align:center;

  color:#806f64;

  font-size:11px;

  margin-top:12px;
}

/* =========================
   HIDDEN
========================= */

.hidden{
  display:none !important;
}

/* =========================
   TOAST
========================= */

#toast{
  position:fixed;

  left:50%;
  bottom:25px;

  transform:
    translate(-50%,20px);

  opacity:0;

  pointer-events:none;

  background:#24170f;
  color:#fff;

  padding:11px 15px;

  border-radius:13px;

  font-size:12px;
  font-weight:900;

  transition:.2s;

  z-index:20;

  max-width:90%;

  text-align:center;
}

#toast.show{
  opacity:1;

  transform:
    translate(-50%,0);
}

/* =========================
   SMALL SCREENS
========================= */

@media(max-width:420px){

  .auth-card{
    padding:20px;
    border-radius:22px;
  }

  .logo{
    font-size:28px;
  }

}
</style>
</head>

<body>

<!-- =========================
     AUTH CARD
========================= -->

<div class="auth-card">

  <div class="logo">
    MOODCHAT <span>💬</span>
  </div>

  <p class="auth-sub" id="authSub">
    Talk to people who feel the same way you do.
  </p>

  <!-- LOGIN / SIGNUP TABS -->

  <div class="tabs">

    <button
      id="loginTab"
      class="active"
      type="button"
    >
      Login
    </button>

    <button
      id="signupTab"
      type="button"
    >
      Sign Up
    </button>

  </div>


  <!-- =========================
       AUTH FORM
  ========================= -->

  <form id="authForm">

    <!-- USERNAME -->

    <div
      class="field hidden"
      id="usernameField"
    >

      <label for="username">
        Username
      </label>

      <input
        id="username"
        type="text"
        maxlength="30"
        autocomplete="username"
        placeholder="Your username"
      >

    </div>


    <!-- EMAIL -->

    <div class="field">

      <label for="email">
        Email
      </label>

      <input
        id="email"
        type="email"
        autocomplete="email"
        placeholder="you@example.com"
        required
      >

    </div>


    <!-- PASSWORD -->

    <div class="field">

      <label for="password">
        Password
      </label>

      <input
        id="password"
        type="password"
        minlength="6"
        autocomplete="current-password"
        placeholder="At least 6 characters"
        required
      >

    </div>


    <!-- GENDER -->

    <div
      class="field hidden"
      id="genderField"
    >

      <label for="gender">
        Gender
      </label>

      <select id="gender">

        <option value="">
          Select gender
        </option>

        <option value="Male">
          Male
        </option>

        <option value="Female">
          Female
        </option>

        <option value="Other">
          Other
        </option>

      </select>

    </div>


    <!-- SUBMIT -->

    <button
      class="primary"
      id="authSubmitBtn"
      type="submit"
    >
      Login
    </button>

  </form>


  <div class="small-note">
    Your account is secured with Firebase.
  </div>

</div>


<!-- TOAST -->

<div id="toast"></div>


<!-- =========================
     FIREBASE
========================= -->

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>


<!-- AUTH JAVASCRIPT -->

<script src="auth.js?v=3"></script>

</body>
</html>
