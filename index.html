<style>
*{box-sizing:border-box} :root{--bg:#fff7f0;--surface:#fff;--surface2:#fff0e5;--text:#24170f;--muted:#806f64;--accent:#ff7a18;--border:#eadbd0;--shadow:0 12px 35px #502d141f}body{margin:0;font-family:system-ui,Arial,sans-serif;background:var(--bg);color:var(--text);min-height:100vh}button,input,select{font:inherit}button{border:0;cursor:pointer}.hidden{display:none!important}
#authScreen{min-height:100vh;display:grid;place-items:center;padding:20px;background:radial-gradient(circle at 15% 10%,#ffd0df,transparent 35%),radial-gradient(circle at 90% 90%,#ffe0b5,transparent 35%),var(--bg)}.auth-card{width:min(440px,100%);background:#fffffff2;border:1px solid var(--border);border-radius:26px;padding:24px;box-shadow:var(--shadow)}.logo{text-align:center;font-size:31px;font-weight:1000}.logo span{font-size:28px}.auth-sub{text-align:center;color:var(--muted);margin:4px 0 20px}.tabs{display:flex;background:var(--surface2);padding:4px;border-radius:14px;margin-bottom:16px}.tabs button{flex:1;padding:11px;border-radius:11px;background:transparent;font-weight:900;color:var(--muted)}.tabs button.active{background:var(--surface);color:var(--text);box-shadow:0 3px 12px #00000014}.field{margin:12px 0}.field label{display:block;font-size:12px;font-weight:900;margin-bottom:6px}.field input,.field select,.composer input{width:100%;padding:13px 14px;border:1px solid var(--border);border-radius:13px;outline:0;background:#fff;color:var(--text)}.primary,.send{background:var(--accent);color:#fff;font-weight:950;border-radius:13px;padding:13px 16px}.primary{width:100%;margin-top:7px}.small-note{text-align:center;font-size:11px;color:var(--muted);margin-top:12px}
#appScreen{min-height:100vh}.topbar{height:62px;position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:10px;padding:8px 12px;background:#fffffff2;backdrop-filter:blur(15px);border-bottom:1px solid var(--border)}.icon-btn{width:44px;height:44px;border-radius:13px;background:var(--surface2);font-size:21px}.brand-mini{font-weight:1000}.top-mood{margin-left:auto;background:var(--surface2);border:1px solid var(--border);padding:9px 12px;border-radius:13px;font-weight:900}.profile-btn{width:42px;height:42px;border-radius:50%;background:var(--accent);color:#fff;font-weight:1000;overflow:hidden;padding:0}.profile-btn img,.avatar img,.profile-big img{width:100%;height:100%;object-fit:cover}.layout{max-width:1100px;margin:auto}.main{padding:15px}.view{display:none}.view.active{display:block}.card{background:var(--surface);border:1px solid var(--border);border-radius:20px;box-shadow:0 7px 25px #502d140f}.chat-head{padding:16px;display:flex;align-items:center;gap:12px}.room-emoji{width:48px;height:48px;border-radius:15px;display:grid;place-items:center;background:var(--surface2);font-size:27px}.chat-title{font-weight:1000;font-size:20px}.chat-sub{font-size:12px;color:var(--muted)}.online{margin-left:auto;font-size:12px;font-weight:900;color:#269a55}.feed{height:calc(100vh - 220px);min-height:350px;overflow:auto;padding:12px}.msg{display:flex;gap:8px;margin:10px 0;align-items:flex-start}.msg.me{flex-direction:row-reverse}.avatar{width:38px;height:38px;min-width:38px;border-radius:50%;display:grid;place-items:center;background:var(--accent);color:#fff;font-weight:1000;overflow:hidden}.msg-bubble{max-width:78%}.name{font-size:11px;font-weight:900;color:var(--muted);margin:0 4px 4px}.bubble{background:var(--surface2);padding:10px 12px;border-radius:15px;line-height:1.4;word-break:break-word}.msg.me .bubble{background:var(--accent);color:#fff}.bubble img{display:block;max-width:230px;max-height:260px;border-radius:12px;margin-bottom:6px}.composer{display:flex;gap:7px;padding:10px;border-top:1px solid var(--border);background:var(--surface);position:sticky;bottom:0;z-index:10}.composer input{flex:1;min-width:0} .composer button{width:45px}#typing{height:20px;padding:0 15px;font-size:11px;color:var(--muted);font-weight:800}
.section-title{font-size:22px;font-weight:1000;margin:8px 0 14px}.person,.rank{display:flex;align-items:center;gap:10px;padding:12px;border-bottom:1px solid var(--border)}.person-info{min-width:0;flex:1}.person-info strong,.person-info small{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.person-info small{color:var(--muted);font-size:11px}.person button{background:var(--surface2);padding:9px 12px;border-radius:11px;font-weight:900}.filters{display:flex;gap:7px;overflow:auto;padding-bottom:10px}.filter{white-space:nowrap;background:var(--surface);border:1px solid var(--border);padding:9px 11px;border-radius:12px;font-size:12px;font-weight:900}.filter.active{background:var(--accent);color:#fff;border-color:var(--accent)}.rank-num{width:30px;text-align:center;font-weight:1000}.points{font-weight:1000}
.profile-card{text-align:center;padding:24px}.profile-big{width:105px;height:105px;border-radius:50%;margin:auto;background:var(--accent);color:#fff;display:grid;place-items:center;font-size:35px;font-weight:1000;overflow:hidden}.profile-actions{display:flex;gap:8px;justify-content:center;margin-top:15px;flex-wrap:wrap}.profile-actions button,.photo-change{background:var(--surface2);padding:10px 13px;border-radius:12px;font-weight:900}.photo-label{display:inline-block;cursor:pointer}.photo-label input{display:none}.stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:15px}.stat{background:var(--surface2);padding:12px;border-radius:13px}.stat strong{display:block;font-size:18px}.stat small{color:var(--muted)}
.drawer-bg{position:fixed;inset:0;background:#00000059;z-index:90;display:none}.drawer-bg.open{display:block}.drawer{position:fixed;z-index:100;left:0;top:0;bottom:0;width:min(310px,88vw);background:var(--surface);transform:translateX(-105%);transition:.22s;padding:16px;box-shadow:20px 0 50px #0003}.drawer.open{transform:translateX(0)}.drawer-head{display:flex;align-items:center;gap:10px;padding:8px 0 18px;border-bottom:1px solid var(--border)}.drawer-name{font-weight:1000}.nav{padding-top:10px}.nav button{width:100%;text-align:left;padding:13px 12px;border-radius:13px;background:transparent;font-weight:900;margin:2px 0}.nav button.active,.nav button:hover{background:var(--surface2)}.drawer-bottom{position:absolute;left:16px;right:16px;bottom:18px}.logout{width:100%;padding:12px;border-radius:12px;background:#ffe4e4;color:#b62b2b;font-weight:1000}
.popover{position:fixed;inset:0;background:#0000006b;z-index:200;display:none;align-items:center;justify-content:center;padding:15px}.popover.open{display:flex}.popover-box{width:min(500px,100%);max-height:90vh;overflow:auto;background:var(--surface);border-radius:22px;padding:18px;box-shadow:var(--shadow)}.popover-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.close{background:var(--surface2);width:38px;height:38px;border-radius:11px;font-weight:1000}.mood-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.mood-option{display:flex;align-items:center;gap:10px;text-align:left;background:var(--surface2);border:2px solid transparent;padding:12px;border-radius:15px}.mood-option.selected{border-color:var(--accent)}.mood-option small{display:block;color:var(--muted);font-size:10px;margin-top:2px}.toast{position:fixed;left:50%;bottom:25px;transform:translate(-50%,20px);background:#24170f;color:#fff;padding:11px 15px;border-radius:13px;font-size:12px;font-weight:900;opacity:0;pointer-events:none;transition:.2s;z-index:500}.toast.show{opacity:1;transform:translate(-50%,0)}
@media(max-width:600px){.brand-mini{font-size:14px}.top-mood{font-size:12px;padding:9px}.msg-bubble{max-width:84%}.mood-grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<section id="authScreen"><div class="auth-card"><div class="logo">MOODCHAT <span>💬</span></div><p class="auth-sub" id="authSub">Talk to people who feel the same way you do.</p><div class="tabs"><button id="loginTab" class="active">Login</button><button id="signupTab">Sign Up</button></div><form id="authForm"><div class="field hidden" id="usernameField"><label>Username</label><input id="username" maxlength="30" placeholder="Your username"></div><div class="field"><label>Email</label><input id="email" type="email" autocomplete="email" placeholder="you@example.com" required></div><div class="field"><label>Password</label><input id="password" type="password" autocomplete="current-password" placeholder="At least 6 characters" required></div><div class="field hidden" id="genderField"><label>Gender</label><select id="gender"><option>Male</option><option>Female</option><option>Other</option></select></div><button class="primary" id="authSubmitBtn" type="submit">Login</button></form><div class="small-note">Choose or change your mood anytime.</div></div></section>
<section id="appScreen" class="hidden"><header class="topbar"><button class="icon-btn" id="menuBtn">☰</button><div class="brand-mini">MOODCHAT</div><button class="top-mood" id="topMood">🥳 <span id="topMoodText">Happy</span></button><button class="profile-btn" id="profileBtn">A</button></header><div class="layout"><main class="main">
<section id="chatView" class="view active"><div class="card"><div class="chat-head"><div class="room-emoji" id="roomEmoji">🥳</div><div><div class="chat-title" id="roomTitle">🥳 Happy Room</div><div class="chat-sub" id="roomSub">People here are feeling Happy right now.</div></div><div class="online">● <span id="onlineCount">24</span> online</div></div><div id="feed" class="feed"></div><div id="typing"></div><div class="composer"><button class="icon-btn" id="imageBtn">🖼️</button><input id="messageInput" maxlength="1000" placeholder="Say how you feel..."><button class="send" id="sendBtn">➤</button><input id="imageInput" type="file" accept="image/*" hidden></div></div></section>
<section id="messagesView" class="view"><div class="section-title">💬 My Messages</div><div class="card" id="conversations"></div></section>
<section id="liveView" class="view"><div class="section-title">🟢 Live People</div><div class="filters" id="liveFilters"></div><div class="card" id="livePeople"></div></section>
<section id="leaderboardView" class="view"><div class="section-title">🏆 Leaderboard</div><div class="card" id="leaderboard"></div></section>
<section id="profileView" class="view"><div class="section-title">👤 Profile</div><div id="profileCard"></div></section>
</main></div></section>
<div class="drawer-bg" id="drawerBg"></div><aside class="drawer" id="drawer"><div class="drawer-head"><div class="avatar" id="drawerAvatar">A</div><div><div class="drawer-name" id="drawerName">User</div><small id="sideMood" style="color:var(--muted)">🥳 Happy</small></div></div><nav class="nav"><button data-view="chat">💬 Mood Chat</button><button data-view="messages">📨 My Messages</button><button data-view="live">🟢 Live People</button><button data-view="leaderboard">🏆 Leaderboard</button><button data-view="profile">👤 Profile</button></nav><div class="drawer-bottom"><button class="logout" id="logoutBtn">Log Out</button></div></aside>
<div class="popover" id="moodPopover"><div class="popover-box"><div class="popover-head"><h3 style="margin:0">Choose your mood</h3><button class="close" onclick="closePopover('moodPopover')">×</button></div><div class="mood-grid" id="moodGrid"></div></div></div>
<div class="popover" id="profilePopover"><div class="popover-box" id="profilePopoverContent"></div></div><div class="popover" id="privatePopover"><div class="popover-box" id="privateContent"></div></div><div class="toast" id="toast"></div>
<script>
const firebaseConfig={apiKey:"AIzaSyByPYngE0Mcb7DA6VRD5znTFGdGdvX-U0E",authDomain:"moodchat-c8acf.firebaseapp.com",databaseURL:"https://moodchat-c8acf-default-rtdb.firebaseio.com",projectId:"moodchat-c8acf",storageBucket:"moodchat-c8acf.firebasestorage.app",messagingSenderId:"175563017140",appId:"1:175563017140:web:5c2bf6cbf9896363fc00e1",measurementId:"G-52548DKTVH"};
firebase.initializeApp(firebaseConfig);const auth=firebase.auth(),db=firebase.firestore(),rtdb=firebase.database();
const MOODS={flirty:{name:"Flirty",emoji:"😍",color:"#ff4f81"},sad:{name:"Sad",emoji:"😭",color:"#5d78d6"},vexed:{name:"Vexed",emoji:"😡",color:"#e94b45"},happy:{name:"Happy",emoji:"🥳",color:"#ff7a18"},bored:{name:"Bored",emoji:"😴",color:"#8064b8"},heartbroken:{name:"Heartbroken",emoji:"💔",color:"#bd4e75"}};
const state={mode:"login",user:null,mood:null,points:0,history:[],messages:[],privateTarget:null,profilePhoto:""};
let currentFirebaseUser=null,messagesUnsubscribe=null,profileUnsubscribe=null,privateMessagesUnsubscribe=null,conversationsUnsubscribe=null,profilesUnsubscribe=null,presenceUnsubscribe=null;let allProfiles=[],onlineUsers={};
const $=id=>document.getElementById(id),esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c])),initials=n=>String(n||"U").trim().slice(0,1).toUpperCase();
function toast(t){$("toast").textContent=t;$("toast").classList.add("show");clearTimeout(window.tt);window.tt=setTimeout(()=>$('toast').classList.remove('show'),2300)}
function closePopover(id){$(id).classList.remove("open")};function closePrivate(){if(privateMessagesUnsubscribe)privateMessagesUnsubscribe();privateMessagesUnsubscribe=null;state.privateTarget=null;closePopover("privatePopover")}
function currentMood(){return state.mood&&MOODS[state.mood]?MOODS[state.mood]:null}function chatId(a,b){return [a,b].sort().join("_")}function timeValue(t){return t&&typeof t.toMillis==='function'?t.toMillis():0}
function applyMood(){const m=currentMood();document.body.dataset.mood=state.mood||"";document.documentElement.style.setProperty("--accent",m?.color||"#ff7a18");if(m){$("topMoodText").textContent=m.emoji+" "+m.name;$("sideMood").textContent=m.emoji+" "+m.name;$("roomTitle").textContent=m.emoji+" "+m.name+" Room";$("roomSub").textContent="People here are feeling "+m.name+" right now.";$("roomEmoji").textContent=m.emoji}else{$("topMoodText").textContent="Choose mood";$("sideMood").textContent="Choose mood";$("roomTitle").textContent="Choose a mood";$("roomSub").textContent="Pick your mood to enter a room.";$("roomEmoji").textContent="🎭";$("onlineCount").textContent="0"}renderFeed();renderProfile();renderMoodGrid();startPublicListener()}
function renderMoodGrid(){$("moodGrid").innerHTML=Object.entries(MOODS).map(([k,m])=>`<button class="mood-option ${k===state.mood?'selected':''}" data-mood="${k}"><span style="font-size:27px">${m.emoji}</span><span><b>${m.name}</b><small><span id="moodOnline-${k}">0</span> online</small></span></button>`).join("");$("moodGrid").querySelectorAll('[data-mood]').forEach(b=>b.onclick=()=>setMood(b.dataset.mood));updateOnlineCounts()}
async function setMood(k){if(!currentFirebaseUser||!MOODS[k])return;try{state.mood=k;await db.collection('profiles').doc(currentFirebaseUser.uid).set({current_mood:k,updatedAt:firebase.firestore.FieldValue.serverTimestamp()},{merge:true});await db.collection('profiles').doc(currentFirebaseUser.uid).collection('mood_history').add({mood:k,createdAt:firebase.firestore.FieldValue.serverTimestamp()});updatePresence();applyMood();closePopover('moodPopover');toast('Mood changed to '+MOODS[k].name)}catch(e){console.error(e);toast('Mood could not be saved')}}
function openMood(){renderMoodGrid();$('moodPopover').classList.add('open')}
function messageHTML(x){const me=x.userId===currentFirebaseUser?.uid;const photo=x.photoURL||'';return `<div class="msg ${me?'me':''}"><div class="avatar">${photo?`<img src="${esc(photo)}">`:initials(x.username)}</div><div class="msg-bubble"><div class="name">${esc(x.username||'User')} ${MOODS[x.mood]?.emoji||''} ${me?'':'· '+esc(x.handle||'')}</div><div class="bubble">${x.image_base64?`<img src="${esc(x.image_base64)}">`:''}${x.text?esc(x.text):''}</div></div></div>`}
function renderFeed(){if(!state.mood){$('feed').innerHTML='<div style="text-align:center;padding:50px 20px;color:var(--muted)">Choose a mood to enter a room.</div>';return}const room=state.messages.filter(x=>x.mood===state.mood).sort((a,b)=>timeValue(a.createdAt)-timeValue(b.createdAt));$('feed').innerHTML=room.map(messageHTML).join('');requestAnimationFrame(()=>$('feed').scrollTop=$('feed').scrollHeight)}
function startPublicListener(){if(messagesUnsubscribe)messagesUnsubscribe();if(!currentFirebaseUser||!state.mood){state.messages=[];renderFeed();return}messagesUnsubscribe=db.collection('mood_messages').where('mood','==',state.mood).limit(100).onSnapshot(s=>{state.messages=s.docs.map(d=>({id:d.id,...d.data()}));renderFeed()},e=>{console.error(e);toast('Could not load room messages')})}
function compressImage(file,max=700000){return new Promise((resolve,reject)=>{if(!file||!file.type.startsWith('image/'))return reject(new Error('invalid'));const r=new FileReader();r.onerror=reject;r.onload=()=>{const img=new Image();img.onload=()=>{let w=img.width,h=img.height,m=900;if(w>m||h>m){const q=Math.min(m/w,m/h);w=Math.round(w*q);h=Math.round(h*q)}const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);let q=.78,data=c.toDataURL('image/jpeg',q);while(data.length>max&&q>.25){q-=.08;data=c.toDataURL('image/jpeg',q)}data.length<=max?resolve(data):reject(new Error('large'))};img.onerror=reject;img.src=r.result};r.readAsDataURL(file)})}
async function sendPublic(text,image=null){text=(text||'').trim();if(!currentFirebaseUser)return toast('Please log in first');if(!state.mood)return toast('Choose a mood first');if(!text&&!image)return;try{await db.collection('mood_messages').add({userId:currentFirebaseUser.uid,username:state.user.username,handle:'@'+state.user.username.toLowerCase().replace(/\s+/g,''),photoURL:state.profilePhoto||'',mood:state.mood,text,image_base64:image||null,createdAt:firebase.firestore.FieldValue.serverTimestamp()});await db.collection('profiles').doc(currentFirebaseUser.uid).set({points:firebase.firestore.FieldValue.increment(10),updatedAt:firebase.firestore.FieldValue.serverTimestamp()},{merge:true});$('messageInput').value='';$('typing').textContent='';toast('+10 points')}catch(e){console.error(e);toast('Message could not be sent')}}
function loadProfiles(){if(profilesUnsubscribe)profilesUnsubscribe();profilesUnsubscribe=db.collection('profiles').limit(100).onSnapshot(s=>{allProfiles=s.docs.map(d=>({uid:d.id,...d.data()}));renderLive();renderLeaderboard();renderConversations()},e=>console.error('Profiles:',e))}
function startPresenceListener(){if(presenceUnsubscribe)presenceUnsubscribe();presenceUnsubscribe=rtdb.ref('presence').on('value',s=>{onlineUsers=s.val()||{};updateOnlineCounts();renderLive();updatePrivateStatus()})}
function updatePresence(){if(!currentFirebaseUser)return;const ref=rtdb.ref('presence/'+currentFirebaseUser.uid);ref.set({username:state.user?.username||'User',mood:state.mood||null,gender:state.user?.gender||'',lastSeen:firebase.database.ServerValue.TIMESTAMP});ref.onDisconnect().remove()}
function removePresence(){if(currentFirebaseUser)rtdb.ref('presence/'+currentFirebaseUser.uid).remove().catch(()=>{})}
function updateOnlineCounts(){const counts={};Object.keys(MOODS).forEach(k=>counts[k]=0);Object.values(onlineUsers||{}).forEach(p=>{if(p&&counts[p.mood]!==undefined)counts[p.mood]++});if(state.mood)$('onlineCount').textContent=counts[state.mood]||0;Object.keys(counts).forEach(k=>{const e=$('moodOnline-'+k);if(e)e.textContent=counts[k]})}
function userObject(u){return{uid:u.uid,username:u.username,email:u.email||'',gender:u.gender||'',mood:u.current_mood||null,points:Number(u.points||0),photoURL:u.photoURL||''}}
function renderLive(){const keys=['all',...Object.keys(MOODS)];$('liveFilters').innerHTML=keys.map(k=>`<button class="filter ${k==='all'?'active':''}" data-filter="${k}">${k==='all'?'All':MOODS[k].emoji+' '+MOODS[k].name}</button>`).join('');let filter='all';const draw=()=>{const users=allProfiles.filter(u=>u.uid!==currentFirebaseUser?.uid&&onlineUsers[u.uid]&&u.username&&(filter==='all'||u.current_mood===filter));$('livePeople').innerHTML=users.map(u=>`<div class="person"><div class="avatar">${u.photoURL?`<img src="${esc(u.photoURL)}">`:initials(u.username)}</div><div class="person-info"><strong>${esc(u.username)} ${MOODS[u.current_mood]?.emoji||''}</strong><small>@${esc(u.username)} · ${MOODS[u.current_mood]?.name||'No mood'} · ● online</small></div><button data-chat="${esc(u.uid)}">Chat</button></div>`).join('')||'<div style="padding:25px;text-align:center;color:var(--muted)">No other users are online right now.</div>';document.querySelectorAll('#livePeople [data-chat]').forEach(b=>{const u=allProfiles.find(x=>x.uid===b.dataset.chat);if(u)openPrivate(userObject(u))})};$('liveFilters').querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{filter=b.dataset.filter;$('liveFilters').querySelectorAll('.filter').forEach(x=>x.classList.remove('active'));b.classList.add('active');draw()});draw()}
function renderLeaderboard(){const users=[...allProfiles].sort((a,b)=>Number(b.points||0)-Number(a.points||0));$('leaderboard').innerHTML=users.map((u,i)=>`<div class="rank"><div class="rank-num">${i+1}</div><div class="avatar">${u.photoURL?`<img src="${esc(u.photoURL)}">`:initials(u.username)}</div><div class="person-info"><strong>${esc(u.username||'User')} ${MOODS[u.current_mood]?.emoji||''}</strong><small>${u.uid===currentFirebaseUser?.uid?'You':'@'+esc(u.username||'user')}</small></div><div class="points">${Number(u.points||0)} pts</div></div>`).join('')||'<div style="padding:25px;text-align:center;color:var(--muted)">No users yet.</div>'}
function renderConversations(){if(!currentFirebaseUser){$('conversations').innerHTML='';return}if(conversationsUnsubscribe)conversationsUnsubscribe();conversationsUnsubscribe=db.collection('private_chats').where('members','array-contains',currentFirebaseUser.uid).limit(100).onSnapshot(s=>{const chats=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(b.lastMessageAt?.toMillis?.()||0)-(a.lastMessageAt?.toMillis?.()||0));$('conversations').innerHTML=chats.map(c=>{const otherUid=(c.members||[]).find(x=>x!==currentFirebaseUser.uid),other=allProfiles.find(u=>u.uid===otherUid);if(!other)return '';return `<div class="person"><div class="avatar">${other.photoURL?`<img src="${esc(other.photoURL)}">`:initials(other.username)}</div><div class="person-info"><strong>${esc(other.username)} ${MOODS[other.current_mood]?.emoji||''}</strong><small>${esc(c.lastMessage||'No messages yet')} · ${onlineUsers[otherUid]?'● online':'offline'}</small></div><button data-open-private="${esc(otherUid)}">Chat</button></div>`}).join('')||'<div style="padding:30px;text-align:center;color:var(--muted)">No private conversations yet.</div>';document.querySelectorAll('#conversations [data-open-private]').forEach(b=>{const u=allProfiles.find(x=>x.uid===b.dataset.openPrivate);if(u)openPrivate(userObject(u))})},e=>console.error('Conversations:',e))}
function updatePrivateStatus(){if(state.privateTarget){const e=$('privateOnlineStatus');if(e)e.textContent=onlineUsers[state.privateTarget.uid]?'● Online':'Offline'}}
function openPrivate(p){if(!p||!currentFirebaseUser||p.uid===currentFirebaseUser.uid)return;if(privateMessagesUnsubscribe)privateMessagesUnsubscribe();state.privateTarget=p;const m=MOODS[p.mood];$('privateContent').innerHTML=`<div class="popover-head"><div style="display:flex;align-items:center;gap:10px"><div class="avatar">${p.photoURL?`<img src="${esc(p.photoURL)}">`:initials(p.username)}</div><div><h3 style="margin:0">${esc(p.username)} ${m?.emoji||''}</h3><small id="privateOnlineStatus" style="color:#269a55">${onlineUsers[p.uid]?'● Online':'Offline'}</small></div></div><button class="close" onclick="closePrivate()">×</button></div><div style="background:var(--surface2);border-radius:15px;padding:10px;font-size:12px;font-weight:900;text-align:center;margin-bottom:10px">You: ${currentMood()?.emoji||'🎭'} + ${esc(p.username)}: ${m?.emoji||'🎭'} = Perfect Match!</div><div id="privateMessages" class="feed" style="height:300px;background:var(--bg);border-radius:15px"></div><div class="composer"><button class="icon-btn" id="privateImageBtn">🖼️</button><input id="privateInput" maxlength="1000" placeholder="Message ${esc(p.username)}..."><button id="privateSend" class="send">➤</button><input id="privateImageInput" type="file" accept="image/*" hidden></div>`;$('privatePopover').classList.add('open');const id=chatId(currentFirebaseUser.uid,p.uid);privateMessagesUnsubscribe=db.collection('private_chats').doc(id).collection('messages').orderBy('createdAt','asc').limit(100).onSnapshot(s=>{const items=s.docs.map(d=>({id:d.id,...d.data()}));$('privateMessages').innerHTML=items.map(messageHTML).join('');$('privateMessages').scrollTop=$('privateMessages').scrollHeight},e=>{console.error(e);toast('Could not load private messages')});$('privateSend').onclick=()=>sendPrivate($('privateInput').value);$('privateInput').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendPrivate(e.target.value)}});$('privateImageBtn').onclick=()=>$('privateImageInput').click();$('privateImageInput').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{await sendPrivate('',await compressImage(f))}catch(err){toast('Image is too large or invalid')}e.target.value=''}}
async function sendPrivate(text,image=null){const p=state.privateTarget;text=(text||'').trim();if(!p||!currentFirebaseUser||(!text&&!image))return;try{const id=chatId(currentFirebaseUser.uid,p.uid),ref=db.collection('private_chats').doc(id);await ref.set({members:[currentFirebaseUser.uid,p.uid],lastMessage:image?'📷 Image':text,lastMessageAt:firebase.firestore.FieldValue.serverTimestamp(),updatedAt:firebase.firestore.FieldValue.serverTimestamp()},{merge:true});await ref.collection('messages').add({userId:currentFirebaseUser.uid,username:state.user.username,handle:'@'+state.user.username.toLowerCase().replace(/\s+/g,''),photoURL:state.profilePhoto||'',mood:state.mood||null,text,image_base64:image||null,createdAt:firebase.firestore.FieldValue.serverTimestamp()});await db.collection('profiles').doc(currentFirebaseUser.uid).set({points:firebase.firestore.FieldValue.increment(10),updatedAt:firebase.firestore.FieldValue.serverTimestamp()},{merge:true});if($('privateInput'))$('privateInput').value='';toast('+10 points')}catch(e){console.error(e);toast('Private message could not be sent')}}
function renderProfile(){if(!state.user)return;$('drawerName').textContent=state.user.username||'User';$('drawerAvatar').innerHTML=state.profilePhoto?`<img src="${esc(state.profilePhoto)}">`:initials(state.user.username);$('profileBtn').innerHTML=state.profilePhoto?`<img src="${esc(state.profilePhoto)}">`:initials(state.user.username);const m=currentMood();$('profileCard').innerHTML=`<div class="card profile-card"><div class="profile-big">${state.profilePhoto?`<img src="${esc(state.profilePhoto)}">`:initials(state.user.username)}</div><h2 style="margin:12px 0 3px">${esc(state.user.username||'User')}</h2><p style="color:var(--muted);margin:0">${esc(state.user.email||'')}</p><div style="margin:12px auto;background:var(--surface2);padding:9px;border-radius:12px;width:max-content;font-weight:900">${m?m.emoji+' '+m.name:'🎭 Choose a mood'}</div><div class="stat-grid"><div class="stat"><strong>${state.points}</strong><small>Points</small></div><div class="stat"><strong>${state.history.length}</strong><small>Mood changes</small></div><div class="stat"><strong>${allProfiles.length}</strong><small>People</small></div></div><div class="profile-actions"><button id="profileMood">🎭 Change mood</button><label class="photo-label"><span class="photo-change">📷 Change profile picture</span><input id="profilePhotoInput" type="file" accept="image/*"></label></div></div>`;$('profileMood').onclick=openMood;$('profilePhotoInput').onchange=handleProfilePhoto}
async function handleProfilePhoto(e){const f=e.target.files[0];if(!f)return;try{toast('Preparing profile picture...');const photo=await compressImage(f);state.profilePhoto=photo;await db.collection('profiles').doc(currentFirebaseUser.uid).set({photoURL:photo,updatedAt:firebase.firestore.FieldValue.serverTimestamp()},{merge:true});renderProfile();toast('Profile picture updated')}catch(err){console.error(err);toast('Could not use that image')}e.target.value=''}
async function loadHistory(){try{const s=await db.collection('profiles').doc(currentFirebaseUser.uid).collection('mood_history').orderBy('createdAt','desc').limit(100).get();state.history=s.docs.map(d=>d.data())}catch(e){state.history=[]}}
async function loadProfile(user){currentFirebaseUser=user;try{const ref=db.collection('profiles').doc(user.uid);let snap=await ref.get();if(!snap.exists){await ref.set({uid:user.uid,username:user.email.split('@')[0],email:user.email,gender:'',current_mood:null,points:0,rank:0,photoURL:'',createdAt:firebase.firestore.FieldValue.serverTimestamp()},{merge:true});snap=await ref.get()}const p=snap.data()||{};state.user={uid:user.uid,username:p.username||user.email.split('@')[0],email:p.email||user.email,gender:p.gender||''};state.mood=p.current_mood||null;state.points=Number(p.points||0);state.profilePhoto=p.photoURL||'';await loadHistory();showApp();loadProfiles();startPresenceListener();updatePresence();if(profileUnsubscribe)profileUnsubscribe();profileUnsubscribe=ref.onSnapshot(s=>{const d=s.data();if(!d)return;if(d.username)state.user.username=d.username;if(d.email)state.user.email=d.email;if(d.gender!==undefined)state.user.gender=d.gender;if(typeof d.points==='number')state.points=d.points;if(d.current_mood!==undefined)state.mood=d.current_mood||null;if(typeof d.photoURL==='string')state.profilePhoto=d.photoURL;applyMood();updatePresence()});if(!state.mood)setTimeout(openMood,300)}catch(e){console.error(e);toast('Could not load your profile')}}
function showApp(){$('authScreen').classList.add('hidden');$('appScreen').classList.remove('hidden');renderMoodGrid();applyMood();renderLive();renderConversations();renderLeaderboard();renderProfile();if(!state.mood)setTimeout(openMood,250)}function showAuth(){$('appScreen').classList.add('hidden');$('authScreen').classList.remove('hidden')}
function switchView(v){document.querySelectorAll('.view').forEach(x=>x.classList.remove('active'));$(v+'View')?.classList.add('active');document.querySelectorAll('.nav button[data-view]').forEach(x=>x.classList.toggle('active',x.dataset.view===v));$('drawer').classList.remove('open');$('drawerBg').classList.remove('open');if(v==='messages')renderConversations();if(v==='leaderboard')renderLeaderboard();if(v==='live')renderLive();if(v==='profile')renderProfile()}
function setAuthMode(mode){state.mode=mode;const s=mode==='signup';$('loginTab').classList.toggle('active',!s);$('signupTab').classList.toggle('active',s);$('usernameField').classList.toggle('hidden',!s);$('genderField').classList.toggle('hidden',!s);$('authSubmitBtn').textContent=s?'Create Account':'Login';$('authSub').textContent=s?'Create your account, choose a mood and meet people.':'Talk to people who feel the same way you do.'}
async function authSubmit(e){e.preventDefault();const email=$('email').value.trim(),password=$('password').value,signup=state.mode==='signup';if(!email||password.length<6)return toast('Use a valid email and a password of at least 6 characters');if(signup&&$('username').value.trim().length<2)return toast('Enter a username');$('authSubmitBtn').disabled=true;try{if(signup){const username=$('username').value.trim(),c=await auth.createUserWithEmailAndPassword(email,password);await db.collection('profiles').doc(c.user.uid).set({uid:c.user.uid,username,email,gender:$('gender').value,current_mood:null,points:0,rank:0,photoURL:'',createdAt:firebase.firestore.FieldValue.serverTimestamp()},{merge:true});toast('Account created')}else{await auth.signInWithEmailAndPassword(email,password);toast('Welcome back')}}catch(e){console.error(e);const m={'auth/email-already-in-use':'That email is already registered.','auth/invalid-email':'That email is not valid.','auth/invalid-credential':'Email or password is incorrect.','auth/user-not-found':'Email or password is incorrect.','auth/wrong-password':'Email or password is incorrect.','auth/weak-password':'Password must be at least 6 characters.','auth/network-request-failed':'Check your internet connection.'};toast(m[e.code]||'Authentication failed. Try again.')}finally{$('authSubmitBtn').disabled=false}}
$('loginTab').onclick=()=>setAuthMode('login');$('signupTab').onclick=()=>setAuthMode('signup');$('authForm').onsubmit=authSubmit;$('sendBtn').onclick=()=>sendPublic($('messageInput').value);$('messageInput').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendPublic(e.target.value)}else $('typing').textContent=e.target.value?'Typing…':''});$('imageBtn').onclick=()=>$('imageInput').click();$('imageInput').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{await sendPublic('',await compressImage(f))}catch(err){toast('Image is too large or invalid')}e.target.value=''};$('topMood').onclick=openMood;$('profileBtn').onclick=()=>{renderProfile();$('profilePopoverContent').innerHTML=$('profileCard').innerHTML;$('profilePopover').classList.add('open');const b=$('profilePopoverContent').querySelector('#profileMood'),i=$('profilePopoverContent').querySelector('#profilePhotoInput');if(b)b.onclick=()=>{closePopover('profilePopover');openMood()};if(i)i.onchange=handleProfilePhoto};document.querySelectorAll('.popover').forEach(p=>p.addEventListener('click',e=>{if(e.target===p)p.classList.remove('open')}));$('menuBtn').onclick=()=>{$('drawer').classList.add('open');$('drawerBg').classList.add('open')};$('drawerBg').onclick=()=>{$('drawer').classList.remove('open');$('drawerBg').classList.remove('open')};document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>switchView(b.dataset.view));$('logoutBtn').onclick=async()=>{removePresence();await auth.signOut()};window.addEventListener('beforeunload',removePresence);
auth.onAuthStateChanged(async user=>{if(user)await loadProfile(user);else{currentFirebaseUser=null;state.user=null;state.mood=null;state.points=0;state.history=[];state.messages=[];state.privateTarget=null;state.profilePhoto='';onlineUsers={};[messagesUnsubscribe,profileUnsubscribe,privateMessagesUnsubscribe,conversationsUnsubscribe,profilesUnsubscribe,presenceUnsubscribe].forEach(fn=>{if(fn)fn()});messagesUnsubscribe=profileUnsubscribe=privateMessagesUnsubscribe=conversationsUnsubscribe=profilesUnsubscribe=presenceUnsubscribe=null;showAuth()}});
</script></body></html>
